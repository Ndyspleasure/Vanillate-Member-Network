name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: member_network_test
          POSTGRES_PASSWORD: isolated-ci-test-only
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgres://postgres:isolated-ci-test-only@127.0.0.1:5432/member_network_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: docker build -t member-network:ci .
      - run: node scripts/container-smoke.js
      - name: Upload Wispbyte source package
        uses: actions/upload-artifact@v4
        with:
          name: member-network-wispbyte-source
          path: |
            src/
            public/
            db/
            scripts/migrate.js
            scripts/cleanup.js
            scripts/preflight.js
            scripts/provision-runtime.js
            scripts/rotate-key.js
            index.js
            package.json
            package-lock.json
            .env.example
            docs/wispbyte.md
          include-hidden-files: true
